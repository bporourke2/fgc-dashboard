# FGC Dashboard: an add-on for an existing Free-Games-Claimer-Remaster (FGC-R) install.
# It does not run the claimer. It reads the claimer's data folder (read-only) and,
# through a read-only Docker socket proxy, the claimer container's state and logs.
#
# Set FGC_DATA to the host folder that the claimer mounts at /fgc/data:
#   - Bind mount (e.g. "./data:/fgc/data" in the claimer's compose):  FGC_DATA=/opt/stacks/fgc/data
#   - Named volume (e.g. "fgc_data:/fgc/data"):  FGC_DATA=/var/lib/docker/volumes/<volume name>/_data
#     (find the name with: docker volume ls | grep fgc_data, e.g. fgc_fgc_data)
# Then: docker compose up -d   (variables can go in a .env file next to this file, see .env.example)
# Portainer: paste this file into Stacks > Add stack > Web editor (or use the Git repository option)
# and set FGC_DATA under "Environment variables". The image is pulled, never built.

services:
  dashboard:
    image: ghcr.io/bporourke2/fgc-dashboard:latest
    container_name: fgc-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      FGC_CONTAINER: ${FGC_CONTAINER:-fgc-remaster}
      BASIC_AUTH_USER: ${DASHBOARD_USER:-}
      BASIC_AUTH_PASS: ${DASHBOARD_PASS:-}
      SHOW_CODES: ${DASHBOARD_SHOW_CODES:-false}
    volumes:
      - ${FGC_DATA:-/var/lib/docker/volumes/fgc_fgc_data/_data}:/fgc/data:ro
      # Optional: the claimer's .env. Only used for config when Docker access is off.
      # - /path/to/fgc/.env:/fgc/.env:ro

  # Exposes only read-only container endpoints (inspect + logs). No POST, no exec, no images.
  # Its port is not published; only containers in this stack can reach it.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: fgc-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

